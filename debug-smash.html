<!DOCTYPE html>
<html><head><title>Debug Smash</title></head><body>
<h1>Debug: Smash Bros content.json</h1>
<div id="result">Loading...</div>
<script>
var urls = [
  "smash-bros/content.json",
  "stores/smash-bros/content.json",
  "/smash-bros/content.json"
];
var out = document.getElementById("result");
var html = "";

function testUrl(url, idx) {
  return fetch(url)
    .then(function(r) {
      html += "<p><b>" + url + "</b>: HTTP " + r.status + " " + r.statusText + "</p>";
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.text();
    })
    .then(function(t) {
      html += "<p>Length: " + t.length + " chars</p>";
      try {
        var j = JSON.parse(t);
        html += "<p style='color:green'>✅ JSON OK! Keys: " + Object.keys(j).slice(0,5).join(", ") + "</p>";
        // Try to access menu like the template does
        if (j.menu && j.menu.categories) {
          html += "<p style='color:green'>✅ Menu categories: " + j.menu.categories.length + "</p>";
        } else {
          html += "<p style='color:orange'>⚠️ No menu.categories</p>";
        }
      } catch(e) {
        html += "<p style='color:red'>❌ Parse failed: " + e.message + "</p>";
        html += "<pre>" + t.substring(0, 200) + "</pre>";
      }
      out.innerHTML = html;
    })
    .catch(function(e) {
      html += "<p style='color:red'>❌ Fetch failed: " + e.message + "</p>";
      out.innerHTML = html;
    });
}

// Test sequentially
testUrl(urls[0], 0).then(function() { return testUrl(urls[1], 1); }).then(function() { return testUrl(urls[2], 2); });
</script>
</body></html>
