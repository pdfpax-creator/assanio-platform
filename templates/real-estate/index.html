<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
<title>Emerald Estates — Lahore's Trusted Property Advisors</title>
<meta name="description" content="Verified houses, flats, plots and commercial properties across Lahore — with honest pricing and complete legal support.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
.hidden{display:none!important}
:root{
  --canvas:#fafaf7; --surface:#ffffff; --surface2:#f3f1ea;
  --primary:#1b2a4a; --accent:#c9a227;
  --on-primary:#ffffff; --on-accent:#1b2a4a; --accent-text:#8a6d1a;
  --ink:#1f2937; --muted:#5b6472; --faint:#9aa3b2;
  --border:#e5e2d8; --border-dk:#d4cfbf;
  --green:#1e7e34; --green-bg:#e9f5ec;
  --wa:#25d366; --wa-dk:#1da851;
  --font-d:'Fraunces',Georgia,serif; --font-b:'Inter',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--canvas);color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;padding-bottom:76px;overflow-x:hidden;opacity:0;transition:opacity .35s}
body.ch-ready{opacity:1}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
.wrap{max-width:1200px;margin:0 auto;padding:0 1rem}
h1,h2,h3{font-family:var(--font-d);letter-spacing:.01em;line-height:1.2}
.kicker{font-family:var(--font-b);font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent-text);display:flex;align-items:center;gap:.6rem;justify-content:center}
.kicker::before,.kicker::after{content:"";width:26px;height:2px;background:var(--accent)}
.sec-head{text-align:center;margin-bottom:1.6rem}
.sec-head h2{font-size:30px;font-weight:700;margin:.5rem 0 .4rem;color:var(--ink)}
.sec-head p{color:var(--muted);font-size:15px;max-width:640px;margin:0 auto}
section.block{padding:3rem 0}
section.band{background:var(--surface2)}
/* ---------- loader ---------- */
.ch-loader{position:fixed;inset:0;background:#fff;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;transition:opacity .4s}
.ch-loader.hide{opacity:0;pointer-events:none}
.ch-loader .spin{width:42px;height:42px;border:3px solid #eee;border-top-color:var(--primary);border-radius:50%;animation:chspin .8s linear infinite}
@keyframes chspin{to{transform:rotate(360deg)}}
.ch-loader p{color:#999;font-size:14px}
/* ---------- announcement ---------- */
.annbar{background:var(--primary);color:var(--on-primary);text-align:center;font-size:13px;font-weight:500;min-height:40px;display:flex;align-items:center;justify-content:center;padding:.55rem 2.6rem .55rem 1rem;position:relative;z-index:60}
.annbar[hidden]{display:none}
.annbar a{color:var(--accent);font-weight:700;margin-left:.4rem;white-space:nowrap;text-decoration:underline;text-underline-offset:2px}
.ann-x{position:absolute;right:.5rem;top:50%;transform:translateY(-50%);width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:18px;opacity:.8;border-radius:6px}
.ann-x:hover{opacity:1;background:rgba(255,255,255,.15)}
/* ---------- header ---------- */
header.site{position:sticky;top:0;z-index:50;background:rgba(250,250,247,.97);border-bottom:1px solid var(--border);transition:box-shadow .2s}
header.site.scrolled{box-shadow:0 2px 12px rgba(27,42,74,.08)}
.hd-in{display:flex;align-items:center;justify-content:space-between;height:64px;gap:.75rem}
.logo{display:flex;align-items:center;gap:.55rem;font-family:var(--font-d);font-weight:700;font-size:19px;letter-spacing:.02em;white-space:nowrap;color:var(--primary)}
.logo .mark{width:34px;height:34px;border-radius:6px;background:var(--primary);color:var(--on-primary);display:flex;align-items:center;justify-content:center;flex:0 0 34px}
nav.desk{display:none;gap:1.4rem;font-size:14px;font-weight:500;color:var(--muted)}
nav.desk a:hover{color:var(--primary)}
nav.desk a{padding:.3rem 0;border-bottom:2px solid transparent}
nav.desk a:hover{border-color:var(--accent)}
.hd-cta{display:flex;align-items:center;gap:.6rem}
.hd-phone{display:none;align-items:center;gap:.4rem;font-size:13px;font-weight:600;color:var(--primary)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;min-height:44px;padding:.7rem 1.3rem;border-radius:6px;font-weight:600;font-size:14px;letter-spacing:.03em;white-space:nowrap}
.btn-pri{background:var(--primary);color:var(--on-primary)}
.btn-pri:hover{filter:brightness(1.12)}
.btn-acc{background:var(--accent);color:var(--on-accent)}
.btn-acc:hover{filter:brightness(1.06)}
.btn-wa{background:var(--wa);color:#fff}
.btn-wa:hover{background:var(--wa-dk)}
.btn-line{border:1px solid var(--border-dk);background:var(--surface);color:var(--ink)}
.btn-line:hover{border-color:var(--primary)}
/* ---------- hero ---------- */
.hero{position:relative;color:#fff;overflow:hidden}
.hero-bg{position:absolute;inset:0}
.hero-bg img{width:100%;height:100%;object-fit:cover}
.hero-bg::after{content:"";position:absolute;inset:0;background:rgba(15,23,42,.62)}
.hero-in{position:relative;z-index:2;padding:3.2rem 0 2.4rem;text-align:center}
.hero-in .kicker{color:var(--accent);justify-content:center}
.hero-in .kicker::before,.hero-in .kicker::after{background:var(--accent)}
.hero h1{font-size:38px;font-weight:700;margin:.7rem auto .6rem;max-width:760px;color:#fff}
.hero .sub{font-size:16px;color:rgba(255,255,255,.85);max-width:620px;margin:0 auto 1.6rem}
/* search panel */
.search-panel{background:var(--surface);border-radius:8px;padding:1.1rem;max-width:980px;margin:0 auto;text-align:left;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.search-panel h3{font-size:17px;color:var(--primary);margin-bottom:.8rem;display:flex;align-items:center;gap:.5rem}
.srch-grid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.srch-field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:.3rem;text-transform:uppercase;letter-spacing:.05em}
.srch-field select,.srch-field input{width:100%;min-height:48px;padding:.6rem .75rem;border:1px solid var(--border-dk);border-radius:6px;background:#fff;font-size:16px}
.srch-field select:focus,.srch-field input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.srch-actions{display:flex;gap:.7rem;margin-top:.9rem}
.srch-actions .btn{flex:1}
/* ---------- property cards ---------- */
.prop-grid{display:grid;grid-template-columns:1fr;gap:1.2rem}
.pcard{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;transition:transform .18s,box-shadow .18s}
.pcard:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(27,42,74,.10)}
.pcard-img{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--surface2)}
.pcard-img img{width:100%;height:100%;object-fit:cover}
.pbadge{position:absolute;top:.7rem;left:.7rem;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:.35rem .7rem;border-radius:4px;color:#fff}
.pbadge.sale{background:var(--primary)}
.pbadge.rent{background:var(--green)}
.pfeat{position:absolute;top:.7rem;right:.7rem;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:.35rem .7rem;border-radius:4px;background:var(--accent);color:var(--on-accent)}
.pcard-body{padding:1rem 1.1rem 1.1rem;display:flex;flex-direction:column;gap:.5rem;flex:1}
.pcard-price{font-family:var(--font-d);font-size:23px;font-weight:700;color:var(--primary)}
.pcard-title{font-size:16px;font-weight:600}
.pcard-loc{display:flex;align-items:center;gap:.35rem;font-size:13px;color:var(--muted)}
.pcard-loc svg{color:var(--accent-text);flex:0 0 auto}
.pcard-meta{display:flex;gap:1rem;padding:.6rem 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);font-size:13px;color:var(--muted)}
.pcard-meta span{display:inline-flex;align-items:center;gap:.35rem}
.pcard-meta svg{color:var(--primary)}
.pcard-actions{display:flex;gap:.6rem;margin-top:auto;padding-top:.4rem}
.pcard-actions .btn{flex:1;min-height:42px;font-size:13px;padding:.6rem .5rem}
.prop-count{font-size:14px;color:var(--muted);margin-bottom:1rem;text-align:center}
.prop-count b{color:var(--primary)}
.empty-state{text-align:center;padding:2.5rem 1rem;color:var(--muted);border:1px dashed var(--border-dk);border-radius:8px;background:var(--surface)}
/* ---------- modal ---------- */
.modal-ov{position:fixed;inset:0;background:rgba(15,23,42,.7);z-index:200;display:none;align-items:flex-start;justify-content:center;padding:1rem;overflow-y:auto}
.modal-ov.open{display:flex}
.modal{background:var(--surface);border-radius:10px;max-width:860px;width:100%;margin:2rem 0;overflow:hidden;position:relative}
.modal-x{position:absolute;top:.6rem;right:.6rem;z-index:5;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center}
.pm-gal{position:relative;background:#111}
.pm-main{aspect-ratio:16/10;overflow:hidden}
.pm-main img{width:100%;height:100%;object-fit:cover}
.pm-thumbs{display:flex;gap:.5rem;padding:.6rem;overflow-x:auto;background:var(--surface)}
.pm-thumbs img{width:84px;height:60px;object-fit:cover;border-radius:4px;cursor:pointer;border:2px solid transparent;flex:0 0 auto}
.pm-thumbs img.on{border-color:var(--accent)}
.pm-body{padding:1.3rem}
.pm-price{font-family:var(--font-d);font-size:30px;font-weight:700;color:var(--primary)}
.pm-title{font-size:19px;font-weight:600;margin:.25rem 0}
.pm-loc{display:flex;align-items:center;gap:.4rem;color:var(--muted);font-size:14px;margin-bottom:.9rem}
.pm-meta{display:flex;flex-wrap:wrap;gap:.6rem;margin-bottom:1rem}
.pm-meta .m{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:.5rem .8rem;font-size:13px;display:inline-flex;align-items:center;gap:.4rem;color:var(--ink)}
.pm-meta .m svg{color:var(--primary)}
.pm-sec{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent-text);margin:1.1rem 0 .5rem}
.pm-desc{font-size:15px;color:var(--muted)}
.pm-feats{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:.45rem}
.pm-feats li{display:flex;align-items:flex-start;gap:.45rem;font-size:14px}
.pm-feats svg{color:var(--green);flex:0 0 auto;margin-top:2px}
.pm-agent{display:flex;align-items:center;gap:.8rem;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:.8rem;margin-top:1rem}
.pm-agent img{width:52px;height:52px;border-radius:50%;object-fit:cover}
.pm-agent .n{font-weight:600;font-size:15px}
.pm-agent .r{font-size:13px;color:var(--muted)}
.pm-actions{display:flex;gap:.7rem;margin-top:1.1rem;flex-wrap:wrap}
.pm-actions .btn{flex:1;min-width:150px}
/* ---------- why us ---------- */
.why-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.why-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:1.3rem 1.1rem;text-align:center}
.why-card .ic{width:52px;height:52px;border-radius:8px;background:var(--surface2);color:var(--primary);display:inline-flex;align-items:center;justify-content:center;margin-bottom:.7rem}
.why-card h3{font-size:16px;margin-bottom:.35rem}
.why-card p{font-size:13.5px;color:var(--muted)}
/* ---------- about ---------- */
.about-grid{display:grid;grid-template-columns:1fr;gap:1.6rem;align-items:center}
.about-img{border-radius:8px;overflow:hidden}
.about-img img{width:100%;aspect-ratio:4/3;object-fit:cover}
.about-txt h2{font-size:28px;margin:.5rem 0 .8rem}
.about-txt p{color:var(--muted);font-size:15px;margin-bottom:.8rem}
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-top:1.2rem}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:1rem;text-align:center}
.stat b{font-family:var(--font-d);font-size:28px;color:var(--primary);display:block}
.stat span{font-size:12.5px;color:var(--muted)}
/* ---------- agents ---------- */
.agent-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.acard{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:1.2rem;text-align:center}
.acard img{width:96px;height:96px;border-radius:50%;object-fit:cover;margin:0 auto .7rem;border:3px solid var(--surface2)}
.acard h3{font-size:16px}
.acard .role{font-size:13px;color:var(--accent-text);font-weight:600;margin:.15rem 0 .3rem}
.acard .exp{font-size:12px;color:var(--faint);margin-bottom:.7rem}
.acard .row{display:flex;gap:.5rem;justify-content:center}
.acard .row .btn{min-height:40px;padding:.55rem .8rem;font-size:12.5px}
/* ---------- testimonials ---------- */
.testi-wrap{position:relative;overflow:hidden}
.testi-track{display:flex;transition:transform .45s ease}
.tcard{flex:0 0 100%;padding:0 .25rem}
.tcard-in{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:1.6rem 1.3rem;text-align:center}
.tcard-in .stars{color:var(--accent);display:flex;justify-content:center;gap:.2rem;margin-bottom:.7rem}
.tcard-in p{font-size:15px;color:var(--ink);font-style:italic;margin-bottom:.9rem}
.tcard-in .n{font-weight:700;font-size:15px}
.tcard-in .m{font-size:13px;color:var(--muted)}
.testi-nav{display:flex;justify-content:center;gap:.6rem;margin-top:1rem}
.testi-nav button{width:44px;height:44px;border-radius:50%;border:1px solid var(--border-dk);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--primary)}
.testi-nav button:hover{border-color:var(--primary)}
.testi-dots{display:flex;justify-content:center;gap:.4rem;margin-top:.7rem}
.testi-dots span{width:8px;height:8px;border-radius:50%;background:var(--border-dk);cursor:pointer}
.testi-dots span.on{background:var(--primary)}
/* ---------- visit form ---------- */
.visit-box{background:var(--primary);border-radius:10px;padding:1.8rem 1.3rem;color:#fff;max-width:760px;margin:0 auto}
.visit-box .kicker{color:var(--accent)}
.visit-box .kicker::before,.visit-box .kicker::after{background:var(--accent)}
.visit-box h2{color:#fff;text-align:center;margin:.5rem 0 .4rem;font-size:26px}
.visit-box .sub{text-align:center;color:rgba(255,255,255,.75);font-size:14px;margin-bottom:1.3rem}
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.vfield label{display:block;font-size:12px;font-weight:600;color:rgba(255,255,255,.7);margin-bottom:.3rem;text-transform:uppercase;letter-spacing:.05em}
.vfield input,.vfield select{width:100%;min-height:50px;padding:.65rem .8rem;border:1px solid rgba(255,255,255,.25);border-radius:6px;background:rgba(255,255,255,.08);color:#fff;font-size:16px}
.vfield input::placeholder{color:rgba(255,255,255,.5)}
.vfield select option{color:#1f2937}
.vfield.full{grid-column:1/-1}
.visit-note{text-align:center;font-size:13px;color:rgba(255,255,255,.6);margin-top:.9rem}
/* ---------- contact ---------- */
.contact-grid{display:grid;grid-template-columns:1fr;gap:1rem}
.c-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:1.2rem;display:flex;gap:.9rem;align-items:flex-start}
.c-card .ic{width:46px;height:46px;border-radius:8px;background:var(--surface2);color:var(--primary);display:flex;align-items:center;justify-content:center;flex:0 0 46px}
.c-card h3{font-size:15px;margin-bottom:.2rem}
.c-card p,.c-card a{font-size:14px;color:var(--muted)}
.c-card a:hover{color:var(--primary)}
.map-ph{background:var(--surface2);border:1px dashed var(--border-dk);border-radius:8px;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;color:var(--muted);font-size:14px;text-align:center;padding:1.5rem}
.map-ph svg{color:var(--accent-text)}
/* ---------- footer ---------- */
footer.site{background:var(--primary);color:rgba(255,255,255,.82);margin-top:3rem}
.foot-grid{display:grid;grid-template-columns:1fr;gap:1.4rem;padding:2.4rem 0 1.6rem}
.foot-grid h3{color:#fff;font-size:16px;margin-bottom:.7rem;font-family:var(--font-b);font-weight:700}
.foot-grid p{font-size:14px;color:rgba(255,255,255,.65)}
.foot-grid ul{list-style:none;display:grid;gap:.45rem}
.foot-grid ul a{font-size:14px;color:rgba(255,255,255,.75)}
.foot-grid ul a:hover{color:var(--accent)}
.foot-brand{display:flex;align-items:center;gap:.55rem;font-family:var(--font-d);font-weight:700;font-size:19px;color:#fff;margin-bottom:.6rem}
.foot-brand .mark{width:34px;height:34px;border-radius:6px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;flex:0 0 34px}
.socials{display:flex;gap:.6rem;margin-top:.9rem}
.socials a{width:40px;height:40px;border-radius:6px;border:1px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;color:#fff}
.socials a:hover{background:rgba(255,255,255,.12)}
.foot-bottom{border-top:1px solid rgba(255,255,255,.15);padding:1rem 0;font-size:13px;color:rgba(255,255,255,.55);text-align:center}
/* ---------- sticky mobile bar ---------- */
.stickybar{position:fixed;left:0;right:0;bottom:0;z-index:90;background:var(--surface);border-top:1px solid var(--border);display:flex;padding:.55rem .7rem calc(.55rem + env(safe-area-inset-bottom));gap:.6rem}
.stickybar .btn{flex:1}
/* ---------- whatsapp float ---------- */
.wa-float{position:fixed;right:1rem;bottom:5.6rem;z-index:90;width:56px;height:56px;border-radius:50%;background:var(--wa);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.25)}
/* ---------- reveal animations ---------- */
.rv{opacity:1}
.rv-hide{opacity:0}
.rv-up{transform:translateY(26px)}.rv-left{transform:translateX(-26px)}.rv-right{transform:translateX(26px)}.rv-zoom{transform:scale(.94)}.rv-fade{transform:none}
.rv-up,.rv-left,.rv-right,.rv-zoom,.rv-fade{transition:opacity .55s ease,transform .55s ease}
.rv-on{opacity:1!important;transform:none!important}
.no-anim .rv,.no-anim .rv-hide{opacity:1!important;transform:none!important;transition:none!important}
@media(prefers-reduced-motion:reduce){.rv,.rv-hide{opacity:1!important;transform:none!important;transition:none!important}}
/* ---------- responsive ---------- */
@media(min-width:640px){
  .prop-grid{grid-template-columns:1fr 1fr}
  .srch-grid{grid-template-columns:repeat(3,1fr)}
  .srch-actions{grid-column:1/-1}
  .why-grid{grid-template-columns:repeat(4,1fr)}
  .agent-grid{grid-template-columns:repeat(3,1fr)}
  .contact-grid{grid-template-columns:1fr 1fr}
  .foot-grid{grid-template-columns:1.4fr 1fr 1fr}
  .pm-feats{grid-template-columns:1fr 1fr 1fr}
}
@media(min-width:900px){
  nav.desk{display:flex}
  .hd-phone{display:inline-flex}
  .prop-grid{grid-template-columns:repeat(3,1fr)}
  .hero h1{font-size:52px}
  .hero-in{padding:4.5rem 0 3rem}
  .about-grid{grid-template-columns:1fr 1fr}
  .sec-head h2{font-size:36px}
  body{padding-bottom:0}
  .stickybar{display:none}
  .wa-float{bottom:1.5rem}
}
@media(max-width:768px){
  input,textarea,select{font-size:16px!important}
}
@media(max-width:430px){
  .logo{font-size:16px}
  .hero h1{font-size:30px}
  .why-grid{grid-template-columns:1fr 1fr}
  .stat-row{grid-template-columns:1fr 1fr}
  .vgrid{grid-template-columns:1fr}
  .pm-actions .btn{min-width:100%}
}
</style>
</head>
<body>
<div class="ch-loader" id="chLoader"><div class="spin"></div><p>Loading...</p></div>

<div class="annbar" id="annBar" hidden>
  <span id="annText"></span>
  <button class="ann-x" id="annX" aria-label="Dismiss">×</button>
</div>

<header class="site">
  <div class="wrap hd-in">
    <a class="logo" href="#top" id="logoLink"><span class="mark" id="logoMark"></span><span id="logoText">EMERALD ESTATES</span></a>
    <nav class="desk" id="deskNav"></nav>
    <div class="hd-cta">
      <a class="hd-phone" id="hdPhone" href="#"><span id="hdPhoneIco"></span><span id="hdPhoneText"></span></a>
      <a class="btn btn-wa" id="hdWa" href="#" target="_blank" rel="noopener"><span id="hdWaIco"></span><span id="hdWaText">WhatsApp Us</span></a>
    </div>

/* ================= search & filter ================= */
function fillSelect(el, items, valKey, labelKey){
  el.innerHTML=items.map(function(it){
    var v=label=it;
    if(typeof it==="object"){v=it[valKey||"value"];label=it[labelKey||"label"]}
    return '<option value="'+esc(v)+'">'+esc(label)+'</option>';
  }).join("");
}
function initSearch(){
  var SC=SITE.search||{};
  fillSelect($("fLocation"),[""].concat(SC.locations||[]));
  $("fLocation").options[0].text="All Locations";
  fillSelect($("fType"),[""].concat(SC.types||[]));
  $("fType").options[0].text="All Types";
  var pur=[{value:"",label:"Buy or Rent"}].concat(SC.purposes||[]);
  fillSelect($("fPurpose"),pur,"value","label");
  var pr=[{value:"",label:"Any price"}].concat((SC.priceRanges||[]).filter(function(r){return r.max!==0}));
  fillSelect($("fPrice"),pr.map(function(r){return{value:String(r.max),label:r.label}}),"value","label");
  var beds=[{value:"0",label:"Any beds"}].concat((SC.bedOptions||[]).filter(function(b){return b.min>0}).map(function(b){return{value:String(b.min),label:b.label+" beds"}}));
  fillSelect($("fBeds"),beds,"value","label");
  $("searchBtn").onclick=applyFilters;
  $("resetBtn").onclick=function(){
    ["fLocation","fType","fPurpose","fPrice","fBeds"].forEach(function(id){$(id).selectedIndex=0});
    renderProps(PROPS);
    document.getElementById("properties").scrollIntoView({behavior:"smooth"});
  };
}
function applyFilters(){
  var loc=$("fLocation").value, type=$("fType").value, pur=$("fPurpose").value;
  var maxP=parseFloat($("fPrice").value), minB=parseInt($("fBeds").value,10)||0;
  var list=PROPS.filter(function(p){
    if(loc && p.area!==loc && p.location.indexOf(loc)<0) return false;
    if(type && p.type!==type) return false;
    if(pur && p.purpose!==pur) return false;
    if(!isNaN(maxP)){
      if(maxP===-1){ if(p.purpose!=="sale"||p.price<50000000) return false; }
      else if(maxP>0 && p.price>maxP) return false;
    }
    if(minB>0 && (!p.beds || p.beds<minB)) return false;
    return true;
  });
  // featured first
  list.sort(function(a,b){return (b.featured?1:0)-(a.featured?1:0)});
  renderProps(list);
  document.getElementById("properties").scrollIntoView({behavior:"smooth"});
}

var tIdx=0,tTimer=null;
function initTesti(){
  var T=SITE.testimonials||{},items=T.items||[];
  if(!items.length){$("testimonials").style.display="none";return}
  $("testiTrack").innerHTML=items.map(function(t){
    var stars="";for(var i=0;i<5;i++)stars+=svgIcon("star",15);
    return '<div class="tcard"><div class="tcard-in"><div class="stars">'+stars+'</div><p>&ldquo;'+esc(t.text)+'&rdquo;</p><div class="n">'+esc(t.name)+'</div><div class="m">'+esc(t.meta||"")+'</div></div></div>';
  }).join("");
  $("testiDots").innerHTML=items.map(function(_,i){return '<span data-d="'+i+'" class="'+(i===0?"on":"")+'"></span>'}).join("");
  $("testiDots").querySelectorAll("span").forEach(function(d){d.onclick=function(){goTesti(+d.getAttribute("data-d"))}});
  $("testiPrev").onclick=function(){goTesti((tIdx-1+items.length)%items.length)};
  $("testiNext").onclick=function(){goTesti((tIdx+1)%items.length)};
  clearInterval(tTimer);tTimer=setInterval(function(){goTesti((tIdx+1)%items.length)},7000);
}
function goTesti(i){
  var n=($("testiTrack").children||[]).length;if(!n)return;
  tIdx=(i+n)%n;
  $("testiTrack").style.transform="translateX(-"+(tIdx*100)+"%)";
  $("testiDots").querySelectorAll("span").forEach(function(d,j){d.classList.toggle("on",j===tIdx)});
}

function validPkPhone(s){var d=String(s).replace(/\D/g,"");return /^(92)?0?3\d{9}$/.test(d)}
function initVisit(){

/* ================= animations ================= */
function countUp(el){
  var target=parseFloat(el.getAttribute("data-count")),suf=el.getAttribute("data-suffix")||"";
  var dec=String(el.getAttribute("data-count")).indexOf(".")>=0?1:0;
  var t0=null,dur=1400;
  function step(ts){if(!t0)t0=ts;var p=Math.min(1,(ts-t0)/dur),e=1-Math.pow(1-p,3);
    el.textContent=(dec?(target*e).toFixed(1):Math.round(target*e).toLocaleString())+suf;
    if(p<1)requestAnimationFrame(step)}
  requestAnimationFrame(step);
}
function initAnims(c){
  document.querySelectorAll(".rv:not(.rv-on)").forEach(function(el){el.classList.add("rv-hide")});
  if(c.theme&&c.theme.animations===false){document.querySelectorAll(".rv-hide").forEach(function(el){el.classList.remove("rv-hide")});return}
  if(!("IntersectionObserver" in window))return;
  var animMap=[
    [".sec-head","rv-up"],[".pcard","rv-up"],[".why-card","rv-zoom"],[".stat","rv-zoom"],
    [".acard","rv-up"],[".tcard-in","rv-fade"],[".c-card","rv-left"],[".visit-box","rv-zoom"],
    [".about-img","rv-left"],[".about-txt","rv-right"],[".map-ph","rv-right"]
  ],targets=[];
  animMap.forEach(function(pair){
    Array.prototype.forEach.call(document.querySelectorAll(pair[0]),function(el,i){
      if(el.classList.contains("rv-on"))return;
      el.classList.add(pair[1]);el.style.transitionDelay=((i%4)*80)+"ms";targets.push(el);
    });
  });
  var io=new IntersectionObserver(function(es){
    es.forEach(function(e){if(!e.isIntersecting)return;var el=e.target;io.unobserve(el);el.classList.add("rv-on");
      var b=el.querySelector("[data-count]");if(b)countUp(b);});
  },{threshold:.08,rootMargin:"0px 0px -30px 0px"});
  targets.forEach(function(el){io.observe(el)});
}
